<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030914">
    <title>CHUCK | AI SYSTEM</title>
</head>
<script src="script.js"></script>
<body>

    <header class="topbar">
        <div class="brand">
            <span class="brand-icon">◈</span>
            <div>
                <h1>CHUCK</h1>
                <small>PERSONAL AI SYSTEM</small>
            </div>
        </div>
        <div class="status">
            <span class="pulse"></span> SYSTEM ONLINE
        </div>
    </header>

    <main>
        <section class="core-section">
            <div class="core">
                <div class="orbit orbit-one"></div>
                <div class="orbit orbit-two"></div>
                <div class="orbit orbit-three"></div>
                <div class="core-center">
                    <span>CHUCK</span>
                    <small>AI CORE</small>
                </div>
            </div>

            <h2>GOOD EVENING</h2>
            <p class="subtitle">Your personal assistant is ready.</p>
            <div id="clock">00:00:00</div>
            <div id="date"></div>
        </section>

        <section class="system-grid">
            <div class="panel">
                <span>◈</span>
                <small>INTELLIGENCE</small>
                <strong>STANDBY</strong>
            </div>
            <div class="panel">
                <span>⌁</span>
                <small>VOICE MODULE</small>
                <strong>READY</strong>
            </div>
            <div class="panel">
                <span>⬡</span>
                <small>SECURITY</small>
                <strong>ACTIVE</strong>
            </div>
        </section>

        <section class="command-panel">
            <h3>COMMAND TERMINAL</h3>
            <div id="messages">
                <p>CHUCK: Hello! I'm ready to assist you.</p>
            </div>

            <div class="input-area">
                <input id="command" placeholder="Enter your command...">
                <button id="send">➤</button>
            </div>
            <button id="voice" class="voice-button">
        🎙 ACTIVATE VOICE
      </button>
        </section>

        <nav class="navigation">
            <button class="nav-btn active" data-page="HOME">⌂<small>HOME</small></button>
            <button class="nav-btn" data-page="AI CORE">◈<small>AI CORE</small></button>
            <button class="nav-btn" data-page="TOOLS">▦<small>TOOLS</small></button>
            <button class="nav-btn" data-page="SETTINGS">⚙<small>SETTINGS</small></button>
        </nav>
    </main>

    <footer>CHUCK SYSTEMS · VERSION 1.0</footer>

</body>

</html>
